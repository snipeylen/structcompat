[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "snipeylen-structcompat"
version = "0.1.0"
description = "逐模型验证结构化输出的支持情况，标出降级方案"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "snipeylen" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://snipeylen.github.io"
Repository = "https://github.com/snipeylen/structcompat"
Issues = "https://github.com/snipeylen/structcompat/issues"

[project.scripts]
structcompat = "structcompat:main"

[tool.setuptools]
py-modules = ["structcompat"]
